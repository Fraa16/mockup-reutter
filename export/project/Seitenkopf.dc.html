<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>

<div style="height:120px;flex:none"></div>

<div style="position:fixed;top:0;left:0;right:0;z-index:70;background:#000;border-bottom:1px solid rgba(255,255,255,.08)">
  <div style="max-width:1440px;margin:0 auto;padding:0 64px;height:38px;display:flex;align-items:center;justify-content:space-between;font:500 12.5px/1 Barlow,sans-serif;color:#8E959F;letter-spacing:.02em">
    <div style="display:flex;align-items:center;gap:26px">
      <span style="display:flex;align-items:center;gap:9px"><span style="width:12px;height:6px;background:#D80D18;transform:skewX(-20deg);display:inline-block"></span>Stuttgart · Ludwigsburg · Gerlingen · Ditzingen · Weilimdorf</span>
      <span style="color:#5C636D">|</span>
      <span>Mobiler Service im gesamten Raum Stuttgart</span>
    </div>
    <div style="display:flex;align-items:center;gap:22px">
      <span style="color:#C6CBD2">Mo–Fr 8–18 Uhr · Sa nach Absprache</span>
      <span style="color:#5C636D">|</span>
      <a href="tel:+4971182859400" style="color:#fff;font-weight:600;letter-spacing:.03em">07 11 / 82 85 940</a>
    </div>
  </div>
</div>

<header style="position:fixed;top:38px;left:0;right:0;z-index:69;background:rgba(10,11,13,.9);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid rgba(255,255,255,.09)">
  <div style="max-width:1440px;margin:0 auto;padding:0 64px;height:82px;display:flex;align-items:center;justify-content:space-between">
    <a href="./Reutter Website.dc.html" style="display:flex;align-items:center;gap:14px;text-decoration:none">
      <span style="display:flex;align-items:center;font-family:Saira,sans-serif;font-weight:900;font-style:italic;font-size:29px;letter-spacing:-.055em;color:#fff;line-height:1">
        <span>REU</span><span>T</span><span style="width:15px;height:16px;background:#D80D18;transform:skewX(-14deg);display:inline-block;margin:0 3px"></span><span>T</span><span>ER</span>
      </span>
      <span style="width:1px;height:26px;background:rgba(255,255,255,.16)"></span>
      <span style="font:600 10.5px/1.35 Barlow,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8E959F">Fahrzeug<br>pflege</span>
    </a>
    <nav style="display:flex;align-items:center;gap:34px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <a href="{{ it.href }}" style="position:relative;font:600 14px/1 Barlow,sans-serif;letter-spacing:.03em;color:{{ it.color }};padding:6px 0" style-hover="color:#fff">
          {{ it.label }}
          <span style="position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#D80D18;opacity:{{ it.mark }}"></span>
        </a>
      </sc-for>
      <a href="./Kontakt.dc.html" style="display:flex;align-items:center;gap:10px;background:#D80D18;color:#fff;padding:14px 24px;font:700 13px/1 Saira,sans-serif;letter-spacing:.09em;text-transform:uppercase;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)" style-hover="background:#F2323C">Termin anfragen</a>
    </nav>
  </div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;leistungen&quot;,&quot;galerie&quot;,&quot;betrieb&quot;,&quot;kontakt&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const NAV = [
  { key: 'leistungen', label: 'Leistungen', href: './Leistungen.dc.html' },
  { key: 'galerie', label: 'Galerie', href: './Galerie.dc.html' },
  { key: 'betrieb', label: 'Betrieb', href: './Reutter Website.dc.html#betrieb' },
  { key: 'kontakt', label: 'Kontakt', href: './Kontakt.dc.html' }
];

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    return {
      items: NAV.map(n => ({
        label: n.label,
        href: n.href,
        color: n.key === active ? '#fff' : '#D6DAE0',
        mark: n.key === active ? 1 : 0
      }))
    };
  }
}
</script>
</body>
</html>
