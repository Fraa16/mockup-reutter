# Holt die alte Website clean-box.eu samt aller Bilder ins Repository, nach
# bildpool/altseite/. Dort liegen viele echte Vorher/Nachher-Aufnahmen aus
# Daniels Werkstatt, die auf der neuen Seite noch fehlen.
#
# Laeuft auf GitHub, weil die Arbeitsumgebung, in der die Seite gebaut wird,
# die alte Domain nicht erreichen darf. Einmalig gedacht: Sobald die Bilder
# im Repository liegen, wird dieser Workflow nicht mehr gebraucht. Am
# Umschalttag zeigt clean-box.eu ohnehin auf die neue Seite — danach gibt es
# die alten Bilder nur noch hier.
#
# Laeuft nie auf main: Er schreibt in den Zweig zurueck, auf dem er gestartet
# wurde, und Deployments haengen nur an main.

name: Alte Seite sichern

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/altseite-sichern.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sichern:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Alte Seite spiegeln
        run: |
          set -u
          mkdir -p /tmp/alt && cd /tmp/alt
          # -r -l 5   allen Verweisen folgen, auch in die Galerie-Unterseiten
          # -p        alles mitnehmen, was eine Seite zum Anzeigen braucht
          # -np -nH   nicht nach oben ausbrechen, keinen Hostordner anlegen
          # --quota   Notbremse, falls die Seite unerwartet riesig ist
          # Fehler einzelner Dateien (404 usw.) brechen den Lauf nicht ab.
          wget -r -l 5 -p -np -nH -e robots=off \
               --domains=www.clean-box.eu,clean-box.eu \
               --reject='*.pdf,*.zip,*.mp4,*.mov' \
               --quota=300m --wait=0.2 --tries=2 --timeout=20 \
               --user-agent='Mozilla/5.0 (Sicherung durch den Betreiber)' \
               http://www.clean-box.eu/ || true
          echo "Dateien: $(find . -type f | wc -l)"
          echo "Bilder:  $(find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' -o -iname '*.webp' \) | wc -l)"
          du -sh .

      - name: Ins Repository legen
        run: |
          set -eu
          ziel=bildpool/altseite
          rm -rf "$ziel"
          mkdir -p "$ziel"
          cp -r /tmp/alt/. "$ziel/"
          find "$ziel" -type f | sort > /tmp/liste.txt
          echo "Abgerufen am $(date -u +%Y-%m-%d) von http://www.clean-box.eu/ — unveraendert, Ordnerstruktur wie auf dem Server." > "$ziel/LIESMICH.txt"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ziel"
          if git diff --cached --quiet; then
            echo "Nichts Neues."
            exit 0
          fi
          git commit -q -m "Bildpool: alte Seite clean-box.eu gesichert" -m "Automatisch geholt von .github/workflows/altseite-sichern.yml."
          git push origin "HEAD:${GITHUB_REF_NAME}"
