# Laedt die Website nach einem Merge in main auf den IONOS-Webspace.
#
# Ersetzt die Handarbeit mit FileZilla. Der Zuschnitt folgt einem einzigen
# Grundsatz: Diese Automatik darf NICHTS loeschen. Auf dem Server liegen Dinge,
# die es im Repository nicht gibt und nicht geben darf — Daniels hochgeladene
# Fotos, die Anfragen aus dem Formular mit Namen und Telefonnummern, die
# Panel-Passwoerter und der Postfach-Zugang. Ein Abgleich, der „aufraeumt",
# nimmt genau das mit.
#
# Deshalb wird ausschliesslich hochgeladen und ueberschrieben, nie entfernt.
# Eine Datei, die im Repository verschwindet, bleibt auf dem Server liegen.
# Das ist Absicht: harmloser Ballast statt geloeschter Kundendaten.
#
# Seit November 2026 gehen auch Texte (data/content/) und Fotos
# (public/uploads/) mit — aber nur, was im Panel niemand geaendert hat. Die
# Entscheidung trifft .github/scripts/inhalte-abgleichen.py, Datei fuer Datei.
# Erklaert in docs/automatisch-hochladen.md.

name: Auf IONOS hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probelauf:
        description: 'Nur anzeigen, was passieren wuerde (nichts uebertragen)'
        type: boolean
        default: true

# Zwei gleichzeitige Laeufe wuerden sich gegenseitig ins Gehege kommen.
concurrency:
  group: hochladen
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: ubuntu-latest
    steps:
      # Die ganze Geschichte, nicht nur der letzte Stand: Der Abgleich der
      # Texte erkennt daran, ob der Server eine fruehere Fassung aus dem
      # Repository hat oder eine Aenderung aus dem Panel.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: lftp bereitstellen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Uebertragen
        env:
          SERVER:       ${{ secrets.IONOS_SERVER }}
          BENUTZER:     ${{ secrets.IONOS_BENUTZER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_PASSWORT }}
          TROCKEN:      ${{ inputs.probelauf && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          for name in SERVER BENUTZER LFTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Ein Repository-Geheimnis fehlt ($name). Siehe docs/automatisch-hochladen.md."
              exit 1
            fi
          done

          # Die Befehle kommen ueber die Standardeingabe, nicht als -c "…".
          # Grund: In der Zeichenkette hinter -c muesste jedes $ vor der Shell
          # geschuetzt werden — dann bekommt lftp sie woertlich, und lftp setzt
          # keine Shell-Variablen ein. Genau daran ist der erste Lauf
          # gescheitert: „hostname contains invalid characters", weil dort
          # buchstaeblich $SERVER als Servername ankam.
          #
          # Das Passwort steht in LFTP_PASSWORD und wird mit --env-password
          # gelesen, statt in der Befehlszeile zu stehen, wo es jeder Blick in
          # die Prozessliste mitnaehme.
          #
          # --only-newer waere wirkungslos: Der Checkout setzt allen Dateien
          # den aktuellen Zeitstempel, sie gaelten also immer als neuer.
          #
          # Reihenfolge: erst public/ (Stile, Skripte), dann app/ (Vorlagen).
          # Andersherum stand eine halbe Minute lang neues HTML neben der alten
          # Stildatei — wer in diesem Moment die Seite aufrief, bekam am
          # 14.10.2026 das neue Aufklappmenue ungestaltet und offen ueber den
          # Hero gelegt, und sein Browser hielt die alte Datei danach fest.
          # So herum steht hoechstens kurz altes HTML neben neuen Stilen; die
          # behalten die alten Regeln fast alle, das faellt nicht auf.
          #
          # public/uploads/ bleibt hier aussen vor: Dort liegen auch die Fotos
          # aus dem Panel. Ein Spiegeln wuerde jedes Foto aus dem Repository
          # hochladen, auch solche, die Daniel laengst geloescht hat. Fotos
          # gehen deshalb erst im naechsten Schritt, und nur die gebrauchten.
          lftp -u "$BENUTZER" --env-password "sftp://$SERVER" <<ENDE
          set sftp:auto-confirm yes;
          set net:max-retries 2;
          set net:timeout 15;
          set net:reconnect-interval-base 5;
          set xfer:log no;
          mirror -R --verbose $TROCKEN --exclude ^uploads/ public/  neu/web/;
          mirror -R --verbose $TROCKEN                     app/     neu/app/;
          mirror -R --verbose $TROCKEN                     bin/     neu/bin/;
          bye
          ENDE

      # Texte und Fotos. Erst wird der Stand des Servers geholt — die
      # JSON-Dateien und die Liste der Fotos, nur lesend —, dann entscheidet
      # das Skript, was davon gefahrlos ersetzt werden kann, und schreibt die
      # lftp-Befehle dafuer. Im Probelauf werden sie nur angezeigt.
      #
      # cmd:fail-exit: Scheitert ein Befehl, bricht lftp ab, statt mit dem
      # naechsten weiterzumachen. Ohne Fotoliste galten sonst alle Fotos als
      # fehlend; ein abgebrochenes Hochladen soll rot werden, damit es jemand
      # sieht. Eine dabei halb geschriebene Datei repariert der naechste Lauf
      # (ungueltiges JSON wird immer ersetzt).
      - name: Texte und Fotos abgleichen
        env:
          SERVER:        ${{ secrets.IONOS_SERVER }}
          BENUTZER:      ${{ secrets.IONOS_BENUTZER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_PASSWORT }}
          PROBELAUF:     ${{ inputs.probelauf && 'ja' || '' }}
        run: |
          set -euo pipefail
          stand="$RUNNER_TEMP/server"
          mkdir -p "$stand/inhalt"

          lftp -u "$BENUTZER" --env-password "sftp://$SERVER" <<ENDE
          set sftp:auto-confirm yes;
          set net:max-retries 2;
          set net:timeout 15;
          set net:reconnect-interval-base 5;
          set xfer:log no;
          set cmd:fail-exit yes;
          mirror --no-recursion --include-glob=*.json neu/data/content/ $stand/inhalt/;
          cd neu/web/uploads;
          cls -1 > $stand/fotos.txt;
          cd cache;
          cls -1 > $stand/cache.txt;
          bye
          ENDE

          python3 .github/scripts/inhalte-abgleichen.py \
            --server-inhalt "$stand/inhalt" \
            --server-fotos  "$stand/fotos.txt" \
            --server-cache  "$stand/cache.txt" \
            --befehle       "$stand/befehle.lftp" \
            --bericht       "$stand/bericht.md"
          cat "$stand/bericht.md" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s "$stand/befehle.lftp" ]; then
            exit 0
          fi
          if [ -n "$PROBELAUF" ]; then
            echo "Probelauf — diese Befehle wuerden ausgefuehrt:"
            cat "$stand/befehle.lftp"
            exit 0
          fi

          lftp -u "$BENUTZER" --env-password "sftp://$SERVER" <<ENDE
          set sftp:auto-confirm yes;
          set net:max-retries 2;
          set net:timeout 15;
          set net:reconnect-interval-base 5;
          set xfer:log no;
          set cmd:fail-exit yes;
          source $stand/befehle.lftp;
          bye
          ENDE
          echo "Uebertragen: $(wc -l < "$stand/befehle.lftp") Dateien."

      # Die Kontaktadresse ist der Rauchmelder fuer veraltete Inhalte. Bis
      # November 2026 gingen Texte gar nicht automatisch hoch — ein Text, den
      # man im Repository aenderte und mergte, stand danach nicht auf der
      # Website, ohne Fehlermeldung, ohne Hinweis. Heute faengt der Schritt
      # davor das ab; die Probe bleibt als zweite Sicherung.
      #
      # Genau das ist am 12.09.2026 passiert. Die Kontaktadresse war im
      # Repository seit einem Tag auf info@smartrepair-reutter.de geaendert,
      # auf dem Server stand weiter die alte. Aufgefallen ist es erst, als eine
      # Testanfrage im falschen Postfach landete.
      #
      # Diese Probe faengt den Fall ab. Sie prueft eine einzige Angabe, aber
      # eine, die auf jeder Seite steht und die man unmoeglich uebersieht, wenn
      # sie falsch ist. Bewusst nur eine Warnung: Nach der Uebergabe pflegt
      # Daniel die Inhalte im Panel, und dann ist der Server im Recht, nicht
      # das Repository. Ein Fehlschlag waere dann falsch.
      - name: Stehen die Inhalte des Servers noch auf dem Stand des Repositorys?
        if: ${{ !inputs.probelauf }}
        run: |
          set -euo pipefail
          soll=$(grep -o '"email": *"[^"]*"' data/content/site.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          if [ -z "$soll" ]; then
            echo "::warning::Keine Kontaktadresse in data/content/site.json gefunden — Probe uebersprungen."
            exit 0
          fi
          # Erst vollstaendig laden, DANN suchen — nicht „curl | grep -q".
          # In der Pipe hoert grep -q beim ersten Treffer auf zu lesen; die
          # Adresse stand damals bei Byte ~2200 im Seitenkopf. Kommt die Seite
          # uebers Netz in Stuecken, will curl danach noch schreiben, bekommt
          # „(23) Failure writing output" — und mit pipefail galt die ganze
          # Probe als gescheitert. Sie warnte also genau dann, wenn die Adresse
          # GEFUNDEN wurde. So geschehen beim ersten echten Lauf am 23.09.2026;
          # lokal trat es nicht auf, weil 50 KB in den Pipe-Puffer passen.
          #
          # Seit Oktober 2026 steht die Adresse nur noch im Impressum — der
          # Betrieb will angerufen werden, Kopf und Fuss zeigen sie nicht mehr.
          # Auf der Startseite gesucht, warnte die Probe bei jedem Lauf.
          if ! seite=$(curl -sS --max-time 20 https://smartrepair-reutter.de/impressum/); then
            echo "::warning::Impressum nicht abrufbar — Probe uebersprungen. Die Gegenprobe im naechsten Schritt sagt, ob die Seite laeuft."
            exit 0
          fi
          if grep -qF "$soll" <<<"$seite"; then
            echo "  Kontaktadresse stimmt ueberein: $soll"
          else
            echo "::warning::Die Website zeigt NICHT die Adresse aus dem Repository ($soll). Meist wurde site.json im Panel geaendert — dann ist der Server im Recht, und der Schritt „Texte und Fotos abgleichen\" hat sie deshalb stehen lassen (siehe dort)."
          fi

      - name: Gegenprobe
        if: ${{ !inputs.probelauf }}
        run: |
          set -euo pipefail
          echo "Startseite:"
          curl -sS -o /dev/null -w "  %{http_code}\n" https://smartrepair-reutter.de/
          echo "Unterseite (prueft die Umschreibregeln):"
          curl -sS -o /dev/null -w "  %{http_code}\n" https://smartrepair-reutter.de/leistungen/
          echo "Muss unerreichbar sein:"
          for pfad in /data/users.php /app/bootstrap.php /.user.ini; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://smartrepair-reutter.de$pfad")
            echo "  $pfad -> $code"
            case "$code" in 200) echo "::error::$pfad ist erreichbar — app/ oder data/ liegen im Webbereich."; exit 1;; esac
          done
