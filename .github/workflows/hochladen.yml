# Laedt die Website nach einem Merge in main auf den IONOS-Webspace.
#
# Ersetzt die Handarbeit mit FileZilla. Der Zuschnitt folgt einem einzigen
# Grundsatz: Diese Automatik darf NICHTS loeschen. Auf dem Server liegen Dinge,
# die es im Repository nicht gibt und nicht geben darf — Daniels hochgeladene
# Fotos, die Anfragen aus dem Formular mit Namen und Telefonnummern, die
# Panel-Passwoerter und der Postfach-Zugang. Ein Abgleich, der „aufraeumt",
# nimmt genau das mit.
#
# Deshalb wird ausschliesslich hochgeladen und ueberschrieben, nie entfernt.
# Eine Datei, die im Repository verschwindet, bleibt auf dem Server liegen.
# Das ist Absicht: harmloser Ballast statt geloeschter Kundendaten.

name: Auf IONOS hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probelauf:
        description: 'Nur anzeigen, was passieren wuerde (nichts uebertragen)'
        type: boolean
        default: true

# Zwei gleichzeitige Laeufe wuerden sich gegenseitig ins Gehege kommen.
concurrency:
  group: hochladen
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lftp bereitstellen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Uebertragen
        env:
          SERVER:       ${{ secrets.IONOS_SERVER }}
          BENUTZER:     ${{ secrets.IONOS_BENUTZER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_PASSWORT }}
          TROCKEN:      ${{ inputs.probelauf && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          for name in SERVER BENUTZER LFTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Ein Repository-Geheimnis fehlt ($name). Siehe docs/automatisch-hochladen.md."
              exit 1
            fi
          done

          # Die Befehle kommen ueber die Standardeingabe, nicht als -c "…".
          # Grund: In der Zeichenkette hinter -c muesste jedes $ vor der Shell
          # geschuetzt werden — dann bekommt lftp sie woertlich, und lftp setzt
          # keine Shell-Variablen ein. Genau daran ist der erste Lauf
          # gescheitert: „hostname contains invalid characters", weil dort
          # buchstaeblich $SERVER als Servername ankam.
          #
          # Das Passwort steht in LFTP_PASSWORD und wird mit --env-password
          # gelesen, statt in der Befehlszeile zu stehen, wo es jeder Blick in
          # die Prozessliste mitnaehme.
          #
          # --only-newer waere wirkungslos: Der Checkout setzt allen Dateien
          # den aktuellen Zeitstempel, sie gaelten also immer als neuer.
          #
          # public/uploads/ bleibt aussen vor: Dort liegen die Fotos aus dem
          # Panel. Die gehoeren dem Server, nicht dem Repository — und jeder
          # Durchlauf schoebe sonst sieben Megabyte Platzhalter erneut hoch.
          lftp -u "$BENUTZER" --env-password "sftp://$SERVER" <<ENDE
          set sftp:auto-confirm yes;
          set net:max-retries 2;
          set net:timeout 15;
          set net:reconnect-interval-base 5;
          set xfer:log no;
          mirror -R --verbose $TROCKEN                     app/     neu/app/;
          mirror -R --verbose $TROCKEN                     bin/     neu/bin/;
          mirror -R --verbose $TROCKEN --exclude ^uploads/ public/  neu/web/;
          bye
          ENDE

      # Inhalte liegen in data/ und werden bewusst NICHT uebertragen (siehe
      # docs/automatisch-hochladen.md). Die Folge vergisst man leicht, und sie
      # ist unsichtbar: Ein Text, den man im Repository aendert und merged,
      # steht danach nicht auf der Website — ohne Fehlermeldung, ohne Hinweis.
      #
      # Genau das ist am 12.09.2026 passiert. Die Kontaktadresse war im
      # Repository seit einem Tag auf info@smartrepair-reutter.de geaendert,
      # auf dem Server stand weiter die alte. Aufgefallen ist es erst, als eine
      # Testanfrage im falschen Postfach landete.
      #
      # Diese Probe faengt den Fall ab. Sie prueft eine einzige Angabe, aber
      # eine, die auf jeder Seite steht und die man unmoeglich uebersieht, wenn
      # sie falsch ist. Bewusst nur eine Warnung: Nach der Uebergabe pflegt
      # Daniel die Inhalte im Panel, und dann ist der Server im Recht, nicht
      # das Repository. Ein Fehlschlag waere dann falsch.
      - name: Stehen die Inhalte des Servers noch auf dem Stand des Repositorys?
        if: ${{ !inputs.probelauf }}
        run: |
          set -euo pipefail
          soll=$(grep -o '"email": *"[^"]*"' data/content/site.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          if [ -z "$soll" ]; then
            echo "::warning::Keine Kontaktadresse in data/content/site.json gefunden — Probe uebersprungen."
            exit 0
          fi
          if curl -sS --max-time 20 https://smartrepair-reutter.de/ | grep -qF "$soll"; then
            echo "  Kontaktadresse stimmt ueberein: $soll"
          else
            echo "::warning::Die Website zeigt NICHT die Adresse aus dem Repository ($soll). Entweder ist data/content/ auf dem Server veraltet — dann die Datei von Hand hochladen oder im Panel nachtragen — oder sie wurde im Panel bewusst geaendert. Nach der Uebergabe ist der Server im Recht."
          fi

      - name: Gegenprobe
        if: ${{ !inputs.probelauf }}
        run: |
          set -euo pipefail
          echo "Startseite:"
          curl -sS -o /dev/null -w "  %{http_code}\n" https://smartrepair-reutter.de/
          echo "Unterseite (prueft die Umschreibregeln):"
          curl -sS -o /dev/null -w "  %{http_code}\n" https://smartrepair-reutter.de/leistungen/
          echo "Muss unerreichbar sein:"
          for pfad in /data/users.php /app/bootstrap.php /.user.ini; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://smartrepair-reutter.de$pfad")
            echo "  $pfad -> $code"
            case "$code" in 200) echo "::error::$pfad ist erreichbar — app/ oder data/ liegen im Webbereich."; exit 1;; esac
          done
