; PHP-Einstellungen fuer diese Website.
;
; Bei IONOS stehen upload_max_filesize und post_max_size nicht im Kundenmenue —
; dort laesst sich nur die PHP-Version waehlen. Beide Werte sind aber
; PHP_INI_PERDIR und damit hier setzbar: PHP liest .user.ini aus dem
; Verzeichnis des aufgerufenen Skripts bis hinauf zur Dokumentwurzel. Weil der
; Front-Controller genau hier liegt, gilt die Datei fuer die ganze Seite,
; Foto-Upload im Redaktionsbereich eingeschlossen.
;
; Damit muss beim Einrichten nichts gesucht werden: die Datei geht mit dem
; Inhalt von public/ hoch und wirkt von selbst.
;
; Zwei Eigenheiten: Aenderungen greifen erst nach bis zu fuenf Minuten
; (user_ini.cache_ttl, Standard 300 Sekunden), und auf einem Hoster ohne
; CGI/FastCGI wird die Datei stillschweigend ignoriert. Deshalb behauptet die
; Seite nirgends „12 MB", sondern rechnet die tatsaechliche Grenze aus und
; schreibt sie in die Hilfe (bild_grenze_text() in app/lib/images.php). Was auf
; der Fotoseite steht, ist die Wahrheit.

; Handyfotos sind 3-8 MB, neuere iPhones mehr. Der Standard von 2M reicht nicht.
upload_max_filesize = 12M

; Muss ueber upload_max_filesize liegen, sonst gewinnt der kleinere Wert.
post_max_size = 12M
